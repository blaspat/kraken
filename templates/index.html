<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kraken</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#e6edf3; --dim:#8b949e; --accent:#2f81f7; --green:#3fb950; --red:#f85149; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .wrap { max-width:1100px; margin:0 auto; padding:24px 16px 80px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--dim); margin:0 0 18px; font-size:13px; }
  .searchbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
  .searchbar input[type=text] { flex:1; min-width:220px; background:var(--panel); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:10px 12px; font-size:15px; }
  .searchbar select { background:var(--panel); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:10px 6px; }
  button { background:var(--accent); border:none; color:#fff; border-radius:6px; padding:10px 18px; font-size:14px; cursor:pointer; }
  button:hover { filter:brightness(1.1); }
  button:disabled { opacity:.5; cursor:default; }
  .statusline { color:var(--dim); margin-bottom:10px; font-size:13px; min-height:20px; }
  table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:middle; }
  th { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.4px; background:#10151c; }
  tr:last-child td { border-bottom:none; }
  tr:hover td { background:#1c2129; }
  .name { max-width:460px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:12px; font-weight:600; }
  .badge.seed { color:var(--green); background:rgba(63,185,80,.12); }
  .badge.leech { color:var(--red); background:rgba(248,81,73,.12); }
  .badge.trusted { color:#d29922; background:rgba(210,153,34,.12); }
  .dlbtn { padding:6px 14px; font-size:13px; }
  .magnet { font-size:12px; color:var(--dim); margin-top:6px; word-break:break-all; }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:16px; margin-top:28px; }
  .panel h2 { margin:0 0 12px; font-size:16px; }
  .trow { display:flex; align-items:center; gap:14px; padding:8px 0; border-bottom:1px solid var(--border); }
  .trow:last-child { border-bottom:none; }
  .tname { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pct { width:110px; }
  .bar { height:6px; background:#21262d; border-radius:3px; overflow:hidden; margin-top:4px; }
  .bar > div { height:100%; background:var(--accent); }
  .tstat { width:130px; color:var(--dim); font-size:13px; text-align:right; }
  .err { color:var(--red); font-size:13px; }
  @media (max-width:700px){ .name{max-width:180px;} .tstat{display:none;} }
</style>
</head>
<body>
<div class="wrap">
  <h1>🐙 Kraken <a href="/logout" style="font-size:12px;color:var(--dim);text-decoration:none;float:right;line-height:28px;">logout</a></h1>
  <p class="sub">Search The Pirate Bay · download lands in <code>~/Downloads</code> via Transmission</p>
  <div class="searchbar">
    <input type="text" id="q" placeholder="Search torrents…" autofocus>
    <select id="cat">
      {% for v, label in cats %}<option value="{{ v }}">{{ label }}</option>{% endfor %}
    </select>
    <select id="dir">
      {% for d in dirs %}<option value="{{ d }}" {% if d == default_dir %}selected{% endif %}>{{ d }}</option>{% endfor %}
      <option value="__custom__">Custom path…</option>
    </select>
    <input type="text" id="customdir" placeholder="/path/to/Downloads/..." style="display:none; flex:1; min-width:200px; background:var(--panel); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:10px 12px;">
    <button id="go">Search</button>
  </div>
  <div class="statusline" id="status"></div>
  <div id="results"></div>
  <div class="panel">
    <h2>Active Downloads</h2>
    <div id="active"><div class="sub">Transmission status…</div></div>
  </div>
</div>

<script>
const q = document.getElementById('q'), cat = document.getElementById('cat'), go = document.getElementById('go');
const dirSel = document.getElementById('dir'), customDir = document.getElementById('customdir');
const status = document.getElementById('status'), results = document.getElementById('results'), active = document.getElementById('active');

dirSel.addEventListener('change', () => {
  customDir.style.display = dirSel.value === '__custom__' ? '' : 'none';
});

function currentDir(){
  return dirSel.value === '__custom__' ? (customDir.value.trim() || '~/Downloads') : dirSel.value;
}

function fmtBytes(n){
  if(!n) return '0 B';
  const u=['B','KB','MB','GB','TB']; let i=0;
  while(n>=1024 && i<u.length-1){ n/=1024; i++; }
  return n.toFixed(i?1:0)+' '+u[i];
}

async function search(){
  const query = q.value.trim();
  if(!query) return;
  go.disabled = true;
  status.textContent = 'Searching…';
  results.innerHTML = '';
  try{
    const r = await fetch(`/api/search?q=${encodeURIComponent(query)}&cat=${cat.value}`);
    const d = await r.json();
    if(d.error){ status.textContent = 'Error: '+d.error; return; }
    status.textContent = `${d.results.length} results from ${d.source}`;
    if(!d.results.length){ results.innerHTML = '<div class="sub">Nothing found.</div>'; return; }
    const table = document.createElement('table');
    table.innerHTML = '<thead><tr><th>Name</th><th>Size</th><th>Seed</th><th>Leech</th><th></th></tr></thead><tbody></tbody>';
    const tb = table.querySelector('tbody');
    d.results.forEach(t => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>
          <div class="name">${esc(t.name)}</div>
          <div class="magnet">${esc(t.magnet)}</div>
        </td>
        <td>${t.size_h}</td>
        <td><span class="badge seed">${t.seeders}</span></td>
        <td><span class="badge leech">${t.leechers}</span></td>
        <td><button class="dlbtn" data-magnet="${esc(t.magnet)}" data-name="${esc(t.name)}">Download</button></td>`;
      tb.appendChild(tr);
    });
    results.appendChild(table);
    results.querySelectorAll('.dlbtn').forEach(b => b.addEventListener('click', () => download(b.dataset.magnet, b.dataset.name)));
  }catch(e){ status.textContent = 'Error: '+e.message; }
  finally{ go.disabled = false; }
}

function esc(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function download(magnet, name){
  try{
    const r = await fetch('/api/download', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({magnet, dir: currentDir()})});
    if(r.status === 401){ window.location = '/login'; return; }
    const d = await r.json();
    status.textContent = d.ok ? `🎬 Added: ${name} → ${d.dir || ''}` : 'Error: '+d.error;
    refresh();
  }catch(e){ status.textContent = 'Error: '+e.message; }
}

async function refresh(){
  try{
    const r = await fetch('/api/status');
    if(r.status === 401){ window.location = '/login'; return; }
    const d = await r.json();
    if(d.error){ active.innerHTML = `<div class="err">${esc(d.error)}</div>`; return; }
    if(!d.torrents.length){ active.innerHTML = '<div class="sub">Nothing downloading.</div>'; return; }
    const order = {Downloading:0, 'Download wait':1, Checking:2, 'Check wait':3, Seeding:4, 'Seed wait':5, Stopped:6};
    d.torrents.sort((a,b) => (order[a.status]??9)-(order[b.status]??9));
    active.innerHTML = d.torrents.map(t => `
      <div class="trow">
        <div class="tname" title="${esc(t.dir)}">${esc(t.name)}
        <div style="font-size:12px;color:var(--dim)">📁 ${esc(t.dir)}</div>
      </div>
        <div class="pct">
          <div class="bar"><div style="width:${t.percent}%"></div></div>
          <div style="font-size:12px;color:var(--dim)">${t.percent}%</div>
        </div>
        <div class="tstat">
          <div>${esc(t.status)}</div>
          <div style="font-size:12px;color:var(--dim)">↓ ${fmtBytes(t.down)}/s</div>
        </div>
      </div>`).join('');
  }catch(e){ /* keep old */ }
}

go.addEventListener('click', search);
q.addEventListener('keydown', e => { if(e.key === 'Enter') search(); });
refresh();
setInterval(refresh, 4000);
</script>
</body>
</html>
